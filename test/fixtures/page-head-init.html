<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="comment-mode:page-id" content="head-init-fixture">
<title>Comment mode fixture — init() called from a head inline script</title>
<script src="/comment-mode.js"></script>
<script>
  // document.body does not exist yet here: init() must defer its DOM setup
  // rather than throw.
  window.commentModeInitError = null;
  try {
    window.commentModeInstance = window.CommentMode.init();
  } catch (e) {
    window.commentModeInitError = e.message;
  }
</script>
</head>
<body>
  <main>
    <p id="intro">Comment mode initialised from a head inline script must still work.</p>
  </main>
</body>
</html>
